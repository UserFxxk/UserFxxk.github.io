<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <style>
    .bg { fill: #09090b; stroke: #27272a; stroke-width: 1.5; }
    .node { fill: #121215; stroke: #3f3f46; stroke-width: 1.5; }
    .guard { fill: #062419; stroke: #10b981; stroke-width: 1.5; }
    .title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; fill: #fafafa; }
    .sub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #a1a1aa; }
    .gsub { font-family: 'Fira Code', monospace; font-size: 11px; fill: #34d399; }
    .arrow { stroke: #52525b; stroke-width: 1.5; fill: none; }
  </style>
  <rect class="bg" x="1" y="1" width="758" height="218" rx="10" />

  <!-- Box 1: LLM Agent -->
  <rect class="node" x="24" y="68" width="155" height="84" rx="8" />
  <text class="title" x="101" y="102" text-anchor="middle">LLM Coding Agent</text>
  <text class="sub" x="101" y="122" text-anchor="middle">JSON-RPC 2.0 Client</text>
  <text class="sub" x="101" y="138" text-anchor="middle">(stdio transport)</text>

  <!-- Arrow 1 -->
  <line class="arrow" x1="179" y1="110" x2="235" y2="110" />
  <polygon points="235,106 243,110 235,114" fill="#52525b" />

  <!-- Box 2: Guardrail MCP Server -->
  <rect class="guard" x="244" y="42" width="236" height="136" rx="8" />
  <text class="title" x="362" y="72" text-anchor="middle">Node.js MCP Security Boundary</text>
  <text class="gsub" x="362" y="96" text-anchor="middle">1. Strict JSON Schema Validation</text>
  <text class="gsub" x="362" y="116" text-anchor="middle">2. Package/Coord Regex Allowlist</text>
  <text class="gsub" x="362" y="136" text-anchor="middle">3. Parameterized execFile() (No sh)</text>
  <text class="sub" x="362" y="158" text-anchor="middle">Blocks Indirect Prompt Injection</text>

  <!-- Arrow 2A & 2B -->
  <path class="arrow" d="M 480 85 L 535 62" />
  <polygon points="533,58 542,60 536,66" fill="#52525b" />
  <path class="arrow" d="M 480 135 L 535 158" />
  <polygon points="536,154 542,160 533,162" fill="#52525b" />

  <!-- Box 3A: Android ADB -->
  <rect class="node" x="544" y="24" width="192" height="72" rx="8" />
  <text class="title" x="640" y="52" text-anchor="middle">Android ADB Bridge</text>
  <text class="sub" x="640" y="72" text-anchor="middle">uiautomator XML Tree</text>
  <text class="sub" x="640" y="86" text-anchor="middle">Centroid Resolution</text>

  <!-- Box 3B: Headless Browser CDP -->
  <rect class="node" x="544" y="124" width="192" height="72" rx="8" />
  <text class="title" x="640" y="152" text-anchor="middle">Chromium CDP Bridge</text>
  <text class="sub" x="640" y="172" text-anchor="middle">Isolated Context E2E</text>
  <text class="sub" x="640" y="186" text-anchor="middle">DOM &amp; Network Inspect</text>
</svg>
